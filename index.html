<script>
function initLanding() {
    var $ = function (id) { return document.getElementById(id); };

    // Tabs
    document.querySelectorAll('.auth-tab-premium').forEach(function (tab) {
        tab.addEventListener('click', function () {
            var name = this.dataset.tab;
            document.querySelectorAll('.auth-tab-premium').forEach(function (t) { t.classList.remove('active'); });
            this.classList.add('active');
            document.querySelectorAll('.auth-form-premium').forEach(function (f) { f.classList.remove('active'); });
            $(name + 'Form').classList.add('active');
        });
    });

    // Show / hide password
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = this.previousElementSibling, icon = this.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        });
    });

    function api() {
        if (!window.fbApi) {
            showToast('Could not reach Firebase. Check your connection and refresh the page.', 'error');
            return null;
        }
        return window.fbApi;
    }
    function setBusy(btn, on, label) {
        if (!btn) return;
        if (on) { btn.dataset.h = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + label; }
        else { btn.disabled = false; if (btn.dataset.h) btn.innerHTML = btn.dataset.h; }
    }
    // lets the browser offer to save the password for one-tap fill next time
    function offerSavePassword(email, pw) {
        try {
            if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
                navigator.credentials.store(new PasswordCredential({ id: email, password: pw, name: email })).catch(function () {});
            }
        } catch (_) {}
    }

    // Email login
    $('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = $('loginEmail').value.trim(), pw = $('loginPassword').value;
        if (!email || !pw) { showToast('Please enter your email and password', 'error'); return; }
        var a = api(); if (!a) return;
        var btn = this.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Signing in...');
        a.signIn(email, pw).then(function () {
            offerSavePassword(email, pw);
        }).catch(function (err) {
            setBusy(btn, false);
            showToast(fbErrorMessage(err), 'error');
        });
    });

    // Email sign up
    $('signupForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = $('signupName').value.trim(), email = $('signupEmail').value.trim(), pw = $('signupPassword').value;
        if (!name || !email || !pw) { showToast('Please fill all fields', 'error'); return; }
        if (pw.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
        var a = api(); if (!a) return;
        var btn = this.querySelector('button[type="submit"]');
        setBusy(btn, true, 'Creating account...');
        a.signUp(name, email, pw).then(function () {
            offerSavePassword(email, pw);
        }).catch(function (err) {
            setBusy(btn, false);
            showToast(fbErrorMessage(err), 'error');
        });
    });

    // Google (works as both login and sign up)
    ['googleLoginBtn', 'googleSignupBtn'].forEach(function (id) {
        var b = $(id); if (!b) return;
        b.addEventListener('click', function () {
            var a = api(); if (!a) return;
            b.disabled = true;
            a.google().catch(function (err) {
                var c = err && err.code;
                if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
                showToast(fbErrorMessage(err), 'error');
            }).then(function () { b.disabled = false; });
        });
    });

    // Forgot password
    var forgot = $('forgotLink');
    if (forgot) forgot.addEventListener('click', function (e) {
        e.preventDefault();
        var em = ($('loginEmail').value || '').trim();
        if (!em) { showToast('Type your email above first, then tap "Forgot password?"', 'info'); $('loginEmail').focus(); return; }
        var a = api(); if (!a) return;
        a.resetPassword(em).then(function () {
            showToast('Password reset email sent to ' + em + '. Check your inbox and spam folder.', 'success');
        }).catch(function (err) { showToast(fbErrorMessage(err), 'error'); });
    });
}
</script>

<script>
/* ===== v4: checklist, screenshots, edit/view, daily limit, brokers ===== */
(function () {
'use strict';

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toast(m, t) { if (typeof showToast === 'function') showToast(m, t || 'info'); }
function safeSet(key, val) {
    try { fxStore.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { toast('Storage is full. Remove some old screenshots and try again.', 'error'); return false; }
}
function isImg(s) { return typeof s === 'string' && /^data:image\//.test(s); }
window.fxEsc = esc;

window.fxCloseModal = function (id) { var m = $(id); if (m) m.style.display = 'none'; };
function openModal(id) { var m = $(id); if (m) m.style.display = 'flex'; }

function compressImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
        if (!file || !/^image\//.test(file.type)) { reject(new Error('Please choose an image file.')); return; }
        var r = new FileReader();
        r.onerror = function () { reject(new Error('Could not read the file.')); };
        r.onload = function () {
            var img = new Image();
            img.onerror = function () { reject(new Error('Could not read the image.')); };
            img.onload = function () {
                var s = Math.min(1, maxSide / Math.max(img.width, img.height));
                var c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(img.width * s));
                c.height = Math.max(1, Math.round(img.height * s));
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', quality));
            };
            img.src = r.result;
        };
        r.readAsDataURL(file);
    });
}
function normLink(v) {
    v = (v || '').trim();
    if (!v) return '';
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { var u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}
function setPreview(wrapId, src) {
    var w = $(wrapId); if (!w) return;
    if (isImg(src)) { w.querySelector('img').src = src; w.style.display = 'flex'; }
    else { w.querySelector('img').removeAttribute('src'); w.style.display = 'none'; }

function limitLock() {
    var lim = getDailyLimit();
    var date = $('tradeDate') ? $('tradeDate').value : '';
    var n = trades.filter(function (t) { return t.date === date; }).length;
    var locked = !!date && n >= lim;
    var msg = $('limitMsg');
    if (msg) {
        msg.style.display = locked ? 'flex' : 'none';
        msg.innerHTML = locked ? '<i class="fas fa-hand"></i> You reached your daily limit of ' + lim + ' trade' + (lim === 1 ? '' : 's') + '. Stop trading for today.' : '';
    }
    document.querySelectorAll('#tradeForm .btn-save-trade, #tradeForm .btn-save-download').forEach(function (b) { b.disabled = locked; });
    var sel = $('tradeNumber');
    if (sel && !locked) sel.value = String(Math.min(n + 1, lim));
}
window.fxRefreshLimitUI = function () {
    var lim = getDailyLimit();
    var sel = $('tradeNumber');
    if (sel) {
        var cur = sel.value;
        sel.innerHTML = '';
        for (var i = 1; i <= lim; i++) { var o = document.createElement('option'); o.value = String(i); o.textContent = 'Trade ' + i; sel.appendChild(o); }
        if (cur && parseInt(cur, 10) <= lim) sel.value = cur;
    }
    var inp = $('settingsDailyLimit'); if (inp && document.activeElement !== inp) inp.value = lim;
    var today = new Date().toISOString().split('T')[0];
    var n = trades.filter(function (t) { return t.date === today; }).length;
    var ind = document.querySelector('.trade-limit-indicator');
    if (ind) ind.classList.toggle('full', n >= lim);
    var fill = $('dailyLimitProgress'); if (fill) fill.style.width = Math.min(100, n / lim * 100) + '%';
    limitLock();
};

var etId = null, etShot; // etShot: undefined = unchanged, null = removed, string = new

window.fxEditTrade = function (id) {

    for (var i = 1; i <= max; i++) { var o = document.createElement('option'); o.value = String(i); o.textContent = 'Trade ' + i; n.appendChild(o); }
    n.value = String(t.tradeNumber || 1);

    $('etPnl').value = t.pnl;
    $('etNotes').value = t.notes === 'No notes' ? '' : (t.notes || '');
    $('etLink').value = t.link || '';

};
window.etClearShot = function () { etShot = null; $('etShotInput').value = ''; setPreview('etShotPrev', null); };
window.etSave = function () {

    var date = $('etDate').value, time = $('etTime').value, pnl = parseFloat($('etPnl').value);

    if (link === null) { toast('That link is not valid.', 'error'); return; }
    var others = trades.filter(function (x) { return x.date === date && x.id !== etId; }).length;
    if (others >= getDailyLimit()) { toast('That day already has ' + getDailyLimit() + ' trades (your daily limit).', 'error'); return; }
    t.date = date; t.time = time; t.pnl = pnl;
    t.pair = $('etPair').value; t.direction = $('etDir').value;
    t.tradeNumber = parseInt($('etNum').value, 10) || 1;
    t.strategy = $('etStrategy').value || 'Manual';
    t.notes = $('etNotes').value.trim() || 'No notes';
    t.link = link || null;
    if (etShot !== undefined) t.screenshot = etShot;
    saveTrades();
    fxCloseModal('editTradeModal');
    refreshAll();
    toast('Trade updated', 'success');
};
function bindEditShot() {
    var i = $('etShotInput'); if (!i) return;
    i.addEventListener('change', function () {
        var f = i.files && i.files[0]; if (!f) return;

   EDIT DEPOSIT / WITHDRAWAL
   ===================================================== */
var etxKind = null, etxId = null;
window.fxEditTx = function (kind, id) {
    var list = kind === 'deposit' ? deposits : withdrawals;
    var r = list.find(function (x) { return x.id === id; }); if (!r) return;
    etxKind = kind; etxId = id;
    $('etxHeading').textContent = kind === 'deposit' ? 'Edit Deposit' : 'Edit Withdrawal';
    $('etxDate').value = r.date || ''; $('etxTime').value = r.time || '';
    var s = $('etxBroker'); s.innerHTML = '';
    var names = getBrokers().slice(); if (names.indexOf(r.broker) < 0) names.push(r.broker);
    names.forEach(function (b) { var o = document.createElement('option'); o.value = b; o.textContent = b; s.appendChild(o); });
    s.value = r.broker;
    $('etxAmount').value = r.amount;
    $('etxNotes').value = r.notes && r.notes !== 'Deposit' && r.notes !== 'Withdrawal' ? r.notes : '';
    openModal('editTxModal');
};
window.etxSave = function () {
    var list = etxKind === 'deposit' ? deposits : withdrawals;
    var r = list.find(function (x) { return x.id === etxId; }); if (!r) return;
    var date = $('etxDate').value, time = $('etxTime').value, broker = $('etxBroker').value, amt = parseFloat($('etxAmount').value);
    if (!date || !time || !broker || !(amt > 0)) { toast('Fill all fields with a valid amount.', 'error'); return; }
    if (etxKind === 'deposit') {
        startingBalance = amt; saveStartingBalance();
        r.balanceAfter = amt;
    } else {
        var available = calculateAccountBalance() + r.amount;
        if (amt > available) { toast('Insufficient balance. Available: ' + formatCurrency(available), 'error'); return; }
        r.balanceAfter = r.balanceBefore - amt;
    }
    r.date = date; r.time = time; r.broker = broker; r.amount = amt;
    r.notes = $('etxNotes').value.trim() || (etxKind === 'deposit' ? 'Deposit' : 'Withdrawal');
    if (etxKind === 'deposit') saveDeposits(); else saveWithdrawals();
    fxCloseModal('editTxModal');
    refreshAll();
    toast('Updated', 'success');
};

   BROKERS (editable, no "Other")
   ===================================================== */
var BROKERS_KEY = 'fxTaeBrokers';
function getBrokers() {
    try { var a = JSON.parse(fxStore.getItem(BROKERS_KEY)); if (Array.isArray(a)) return a; } catch (e) { }

}
function saveBrokers(a) { fxStore.setItem(BROKERS_KEY, JSON.stringify(a)); }
function fillBrokerSelects(select) {

        getBrokers().forEach(function (b) { var o = document.createElement('option'); o.value = b; o.textContent = b; s.appendChild(o); });
        s.value = getBrokers().indexOf(cur) >= 0 ? cur : '';

var bmMode = 'add', bmSelectId = null, bmOld = null;
window.fxBrokerOpen = function (mode, selectId) {

    if (mode === 'edit') {

        $('bmName').value = ''; $('bmHeading').textContent = 'Add Broker'; $('bmRemove').style.display = 'none';

window.bmSave = function () {

    var list = getBrokers();
    var dup = list.some(function (b) { return b.toLowerCase() === name.toLowerCase() && b !== bmOld; });
    if (dup) { toast('That broker already exists.', 'error'); return; }
    if (bmMode === 'add') { list.push(name); }
    else {
        var i = list.indexOf(bmOld); if (i >= 0) list[i] = name; else list.push(name);
        deposits.forEach(function (d) { if (d.broker === bmOld) d.broker = name; });
        withdrawals.forEach(function (w) { if (w.broker === bmOld) w.broker = name; });

/* =====================================================
   CHECKLIST
   ===================================================== */
var CL_KEY = 'fxTaeChecklists', CLS_KEY = 'fxTaeChecklistSessions';
var checklists = [], clSessions = [];
window.clCurrent = '';
var clTicks = {}, clShot = null, clShotLoading = false, clEditingId = null, clHistFrom = 'list', clDetailId = null;

function clLoad() {

    try { clSessions = JSON.parse(fxStore.getItem(CLS_KEY)) || []; } catch (e) { clSessions = []; }
}
function clPersist() { return safeSet(CL_KEY, checklists) && safeSet(CLS_KEY, clSessions); }
function clView(name) {
    ['List', 'Session', 'History', 'Detail'].forEach(function (n) { var v = $('clView' + n); if (v) v.hidden = (n !== name); });
    var m = $('mainContent'); if (m) window.scrollTo(0, 0);

};
window.clBackToList = function () { clView('List'); clRenderList(); };

/* open / run a checklist */
window.clOpen = function (id) {
    var c = getList(id); if (!c) return;
    clCurrent = id; clTicks = {}; clShot = null; clShotLoading = false;
    $('clSessionTitle').textContent = c.title;
    $('clShotInput').value = ''; setPreview('clShotPrev', null); $('clNotes').value = '';
    clRenderItems(); clView('Session');
};
function clRenderItems() {
    var c = getList(clCurrent); if (!c) return;
    var done = c.items.filter(function (i) { return clTicks[i.id]; }).length, total = c.items.length;
    var pct = total ? Math.round(done / total * 100) : 0;
    $('clProgText').textContent = done + '/' + total + ' · ' + pct + '%';
    $('clProgFill').style.width = pct + '%';
    $('clItems').innerHTML = c.items.map(function (i) {
        return '<button type="button" class="cl-item" role="checkbox" aria-checked="' + (clTicks[i.id] ? 'true' : 'false') + '" onclick="clToggle(\'' + i.id + '\')">' +

window.clToggle = function (iid) { clTicks[iid] = !clTicks[iid]; clRenderItems(); };
window.clClearShot = function () { clShot = null; clShotLoading = false; $('clShotInput').value = ''; setPreview('clShotPrev', null); };
window.clSaveSession = function () {

    var s = {
        id: uid('s'), cid: c.id, title: c.title, at: new Date().toISOString(),

    };

window.clEditCurrent = function () { if (clCurrent) clOpenEditor(clCurrent); };

/* create / edit checklist */

window.clOpenEditor = function (id) {

    $('clEdTitle').value = c ? c.title : '';

};
window.clSaveEditor = function () {
    var title = $('clEdTitle').value.trim();

    if (!title) { toast('Give your checklist a name.', 'error'); return; }
    if (!texts.length) { toast('Add at least one item.', 'error'); return; }
    var c = clEditingId ? getList(clEditingId) : null;
    if (c) {
        // keep ids for items whose text is unchanged at the same position, new ids otherwise
        var old = c.items.slice();
        c.title = title;

<script>
(function () {

  const cL = document.getElementById('css-landing'), cA = document.getElementById('css-app');
  const vp = document.getElementById('vp');

  }

  }
  window.__fbFail = fail;

  function mount(v) {
    const app = v === 'app';
    cL.media = app ? 'not all' : 'all';
    cA.media = app ? 'all' : 'not all';
    document.body.className = app ? '' : 'landing-page';
    vp.content = app ? 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' : 'width=device-width, initial-scale=1.0';
    document.title = app ? 'FX TAE Dashboard | Professional Trading Journal' : 'FX TAE Charts \u00b7 Professional Trading Journal';
    root.innerHTML = '';
    root.appendChild(document.getElementById(app ? 'tpl-app' : 'tpl-landing').content.cloneNode(true));
    if (app) {
      showLoadingScreen();
      if (window.initEdgeMetrics) window.initEdgeMetrics();
    } else {
      initLanding();
    }
    // one-off messages produced while signing in
    setTimeout(function () {
      if (window.fbRedirectError) { showToast(fbErrorMessage(window.fbRedirectError), 'error'); window.fbRedirectError = null; }
      if (app && window.fbLoadError) {
        showToast('Could not load your data from the cloud: ' + (window.fbLoadError.message || window.fbLoadError) + ' \u2014 changes will not be saved until this is fixed.', 'error');
      }
      (window.fbNotices || []).splice(0).forEach(function (n) { showToast(n.m, n.t || 'info'); });
    }, 900);
  }

  function go() {
    const u = window.fbUser, v = u ? 'app' : 'landing';
    if (v === 'app' && view === 'app' && u.uid !== mountedUid) { location.reload(); return; } // account switched in another tab
    if (v === view) return;
    view = v; mountedUid = u ? u.uid : null;
    mount(v);
  }

  splash(spinner('Loading...'));
  window.__onAuthChange = function () { if (ready) go(); };
  window.fbReady.then(function () { ready = true; go(); });
  setTimeout(function () { if (!ready) fail(); }, 15000);
})();
</script>
<script>
/* ===== Edge Metrics (extra analytics, reads your existing trades) ===== */
window.initEdgeMetrics=function(){
  var KEY='fxTaeTrades',sec=document.getElementById('analytics');
  if(!sec)return;
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var $$=function(n){return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};
  var cl=function(n){return n>0?'adv-pos':n<0?'adv-neg':''};
  function trades(){try{return JSON.parse(fxStore.getItem(KEY)||'[]').filter(function(t){return !t.type||t.type==='trade'}).map(function(t){return{d:String(t.date||''),tm:String(t.time||''),p:+t.pnl||0,pair:t.pair||'-',st:t.strategy||'Manual'}}).sort(function(a,b){return(a.d+a.tm)<(b.d+b.tm)?-1:1})}catch(e){return[]}}
  function grp(T,k){var o={};T.forEach(function(t){o[t[k]]=(o[t[k]]||0)+t.p});return Object.keys(o).map(function(x){return[x,o[x]]}).sort(function(a,b){return b[1]-a[1]})}
  function render(){
    var el=document.getElementById('advMetrics');if(!el)return;var T=trades(),n=T.length;
    var head='<div class="card-header"><h3><i class="fas fa-gauge-high"></i> Edge Metrics</h3></div>';
    if(!n){el.innerHTML=head+'<p class="adv-note">Log a few trades and your edge metrics (profit factor, expectancy, drawdown, streaks and more) will appear here.</p>';return}
    var W=T.filter(function(t){return t.p>0}),Lo=T.filter(function(t){return t.p<0}),gp=W.reduce(function(a,t){return a+t.p},0),gl=Lo.reduce(function(a,t){return a+t.p},0),net=gp+gl;
    var pf=gl<0?gp/Math.abs(gl):(gp>0?Infinity:0),ex=net/n,aw=W.length?gp/W.length:0,al=Lo.length?gl/Lo.length:0,po=al<0?aw/Math.abs(al):(aw>0?Infinity:0);
    var cw=0,cL=0,mw=0,ml=0,cum=0,pk=0,dd=0;
    T.forEach(function(t){if(t.p>0){cw++;cL=0}else if(t.p<0){cL++;cw=0}else{cw=0;cL=0}mw=Math.max(mw,cw);ml=Math.max(ml,cL);cum+=t.p;pk=Math.max(pk,cum);dd=Math.max(dd,pk-cum)});
    var days={};T.forEach(function(t){days[t.d]=(days[t.d]||0)+t.p});var dl=Object.keys(days).map(function(x){return[x,days[x]]}).sort(function(a,b){return b[1]-a[1]});
    var pr=grp(T,'pair'),sg=grp(T,'st'),wd=[0,0,0,0,0,0,0];
    T.forEach(function(t){var d=new Date(t.d+'T12:00:00');if(!isNaN(d))wd[d.getDay()]+=t.p});
    var mx=Math.max(1,Math.max.apply(null,wd.map(Math.abs))),NM=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var K=function(l,v,c,s){return'<div class="adv-k"><span>'+l+'</span><b class="'+(c||'')+'">'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'};
    var verdict=n<30?'Based on '+n+' trade'+(n==1?'':'s')+'. These numbers become meaningful after about 30 or more trades.':(pf>=1.5&&ex>0?'Positive edge so far: profit factor above 1.5 with positive expectancy. Keep your risk consistent.':ex>0?'Slightly positive so far. Focus on cutting your biggest losses.':'Negative expectancy so far. Review your losing trades and your rules.');
    el.innerHTML=head+'<div class="adv-grid">'+
      K('Profit factor',pf===Infinity?'&infin;':pf.toFixed(2),pf>=1?'adv-pos':'adv-neg','gross profit / gross loss')+
      K('Expectancy',$$(ex),cl(ex),'average result per trade')+
      K('Average win',$$(aw),'adv-pos',W.length+' winning trades')+
      K('Average loss',$$(al),'adv-neg',Lo.length+' losing trades')+
      K('Payoff ratio',po===Infinity?'&infin;':po.toFixed(2),'','avg win / avg loss')+
      K('Max drawdown',$$(-dd),dd>0?'adv-neg':'','peak to trough')+
      K('Win streak',mw,'adv-pos','longest in a row')+K('Loss streak',ml,ml>2?'adv-neg':'','longest in a row')+
      K('Best day',dl.length?$$(dl[0][1]):'-',cl(dl.length?dl[0][1]:0),dl.length?esc(dl[0][0]):'')+
      K('Worst day',dl.length?$$(dl[dl.length-1][1]):'-',cl(dl.length?dl[dl.length-1][1]:0),dl.length?esc(dl[dl.length-1][0]):'')+
      K('Best pair',pr.length?esc(pr[0][0]):'-',cl(pr.length?pr[0][1]:0),pr.length?$$(pr[0][1]):'')+
      K('Best strategy',sg.length?esc(sg[0][0]):'-',cl(sg.length?sg[0][1]:0),sg.length?$$(sg[0][1]):'')+
    '</div><h4 style="margin:18px 0 4px">Net P&amp;L by weekday</h4><div class="adv-wd">'+
      wd.map(function(v,i){return'<div><span class="'+cl(v)+'">'+(v?$$(v).replace('.00',''):'')+'</span><i style="height:'+Math.round(Math.abs(v)/mx*80)+'px;background:'+(v>=0?'linear-gradient(180deg,#22c55e,#16a34a)':'linear-gradient(180deg,#f87171,#dc2626)')+'"></i>'+NM[i]+'</div>'}).join('')+
    '</div><p class="adv-note">'+esc(verdict)+'</p>';
  }
  if(!document.getElementById('advMetrics')){var d=document.createElement('div');d.className='analytics-card adv-card';d.id='advMetrics';sec.appendChild(d)}
  render();
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('[data-page="analytics"]'))setTimeout(render,200)});
  fxStore.onChange(function(k){if(k===KEY)setTimeout(render,300)});
};
</script>
<script>
/* ===== PWA: service worker + install button ===== */
(function () {
  var secure = /^https?:$/.test(location.protocol);
  if (secure && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker not registered', e); });
    });
  }
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  if (standalone) return;
  var deferred = null, bar = null;
  function hide() { if (bar) bar.style.display = 'none'; }
  function show() {
    try { if (sessionStorage.getItem('fxInstallDismissed')) return; } catch (_) {}
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'fxInstall';
      bar.innerHTML = '<button type="button" class="go"><i class="fas fa-download"></i>&nbsp; Install app</button><button type="button" class="x" aria-label="Dismiss">&times;</button>';
      document.body.appendChild(bar);
      bar.querySelector('.go').addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; hide(); });
      });
      bar.querySelector('.x').addEventListener('click', function () {
        try { sessionStorage.setItem('fxInstallDismissed', '1'); } catch (_) {}
        hide();
      });
    }
    bar.style.display = 'flex';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', function () { deferred = null; hide(); });
})();
</script>
