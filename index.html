<script>
/* ===== Cloud store: same API as localStorage, persisted to Firebase Firestore ===== */
(function () {
  var COLLECTIONS = { fxTaeTrades: 'trades', fxTaeGoals: 'goals', fxTaeDeposits: 'deposits', fxTaeWithdrawals: 'withdrawals', fxTaeChecklists: 'checklists', fxTaeChecklistSessions: 'checklist_sessions' };
  var data = Object.create(null), listeners = [], timers = {}, pending = {}, inflight = new Set(), lastWarn = 0;

  function warn(msg) {
    var n = Date.now(); if (n - lastWarn < 4000) return; lastWarn = n;
    if (typeof window.showToast === 'function') window.showToast(msg, 'error'); else console.error(msg);
  }
  function run(k) {
    delete timers[k]; delete pending[k];
    if (!s.backend || !s.uid) return Promise.resolve(false);
    var p = s.backend.save(s.uid, k, (k in data) ? data[k] : null).then(
      function () { return true; },
      function (e) { console.error('Cloud save failed', k, e); warn('Could not save to the cloud: ' + ((e && e.message) || e)); return false; }
    );
    inflight.add(p);
    p.then(function () { inflight.delete(p); });
    return p;
  }
  function changed(k) {
    listeners.forEach(function (fn) { try { fn(k); } catch (e) { console.error(e); } });
    if (!s.uid || !s.backend) {
      if (window.fbUser) warn('Not connected to your cloud database, so this change was not saved. Refresh and try again.');
      return;
    }
    pending[k] = true;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(function () { run(k); }, 250);
  }

  var s = window.fxStore = {
    backend: null, uid: null, COLLECTIONS: COLLECTIONS,
    getItem: function (k) { return (k in data) ? data[k] : null; },
    setItem: function (k, v) { data[k] = String(v); changed(k); },
    removeItem: function (k) { delete data[k]; changed(k); },
    keys: function () { return Object.keys(data); },
    onChange: function (fn) { listeners.push(fn); },
    hydrate: function (uid, obj) { data = Object.create(null); Object.keys(obj || {}).forEach(function (k) { data[k] = obj[k]; }); s.uid = uid; },
    reset: function () { Object.keys(timers).forEach(function (k) { clearTimeout(timers[k]); }); timers = {}; pending = {}; data = Object.create(null); s.uid = null; },
    flush: function () {
      Object.keys(pending).forEach(function (k) { clearTimeout(timers[k]); run(k); });
      return Promise.all(Array.from(inflight)).then(function (r) { return r.every(Boolean); });
    }
  };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') s.flush(); });
  window.addEventListener('pagehide', function () { s.flush(); });

  window.fbReady = new Promise(function (r) { window.__fbResolve = r; });

  window.fbErrorMessage = function (e) {
    var c = (e && e.code) || '';
    var m = {
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/wrong-password': 'Incorrect email or password.',
      'auth/user-not-found': 'Incorrect email or password.',
      'auth/invalid-email': 'That email address is not valid.',
      'auth/missing-password': 'Please enter your password.',
      'auth/email-already-in-use': 'An account with this email already exists. Please log in instead.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/too-many-requests': 'Too many attempts. Please wait a few minutes and try again.',
      'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
      'auth/user-disabled': 'This account has been disabled.',
      'auth/popup-blocked': 'Your browser blocked the Google sign-in popup. Allow popups and try again.',
      'auth/account-exists-with-different-credential': 'This email is already registered with another sign-in method. Log in with your email and password.',
      'auth/unauthorized-domain': 'This website\u2019s domain is not authorised in Firebase (Authentication \u2192 Settings \u2192 Authorized domains).',
      'auth/operation-not-allowed': 'This sign-in method is not enabled in Firebase.',
      'auth/requires-recent-login': 'Please log out and log in again, then retry.'
    };
    return m[c] || (e && e.message) || 'Something went wrong. Please try again.';
  };
})();

<script type="module" onerror="window.__fbFail&&window.__fbFail()">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
  GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, sendPasswordResetEmail,
  signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6rDt30aEKvMcRqtBiaIrUIPstIcy5O6c",
  authDomain: "fx-tae-charts-journal.firebaseapp.com",
  projectId: "fx-tae-charts-journal",
  storageBucket: "fx-tae-charts-journal.firebasestorage.app",
  messagingSenderId: "435122798582",
  appId: "1:435122798582:web:b9bc2cef2705a1fd31d1d7",
  measurementId: "G-EYBKP607QH"
};

try {
  const app = initializeApp(firebaseConfig);
  isSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});
  const auth = getAuth(app);          // keeps the user signed in across visits (IndexedDB)
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();
  googleProvider.setCustomParameters({ prompt: 'select_account' });

  /* ---------- one-off cleanup of the old localStorage login system ---------- */
  const LEGACY_JUNK = ['fxTaeUsers', 'fxTaeCurrentUser', 'fxTaeRememberedEmail', 'fxTaeLastLogin', 'fxTaeLastSync', 'fxTaeSyncTrigger', 'pendingNotifications'];
  const LEGACY_DATA = ['fxTaeTrades', 'fxTaeGoals', 'fxTaeDeposits', 'fxTaeWithdrawals', 'fxTaeStartingBalance', 'fxTaeDailyLimit',
    'fxTaeTheme', 'fxTaeTradingRules', 'fxTaeBrokers', 'fxTaeChecklists', 'fxTaeChecklistSessions'];
  const legacyLS = () => { try { return window.localStorage; } catch (e) { return null; } };
  try {
    const l = legacyLS();
    if (l) LEGACY_JUNK.forEach(k => l.removeItem(k));   // old plaintext-password accounts are gone
    sessionStorage.removeItem('fxTaeAuthenticated');
  } catch (e) { }

  /* ---------- Firestore backend for fxStore ----------
     users/{uid}/data/{key}        -> { v: "<string>" }      (small settings: balance, theme, brokers, ...)
     users/{uid}/{collection}/{id} -> { j: "<json>" }        (one doc per trade / goal / deposit / ...)
     users/{uid}/data/idx_{name}   -> { ids: "<json array>" } (keeps list order)                       */
  const written = {};
  const chains = {};

  async function loadAll(uid) {
    const out = {};
    const sd = await getDocs(collection(db, 'users', uid, 'data'));
    if (sd.metadata.fromCache) throw new Error('You appear to be offline.');
    const idx = {};
    sd.forEach(d => {
      const v = d.data();
      if (d.id.startsWith('idx_')) idx[d.id.slice(4)] = v.ids;
      else if (typeof v.v === 'string') out[d.id] = v.v;
    });
    const cols = fxStore.COLLECTIONS;
    await Promise.all(Object.keys(cols).map(async key => {
      const name = cols[key];
      const snap = await getDocs(collection(db, 'users', uid, name));
      const map = {};
      snap.forEach(d => { const j = d.data().j; if (typeof j === 'string') map[d.id] = j; });
      let order = [];
      try { order = JSON.parse(idx[name] || '[]'); } catch (e) { }
      const seen = {}, list = [];
      order.forEach(id => { const sid = String(id); if (map[sid] !== undefined && !seen[sid]) { seen[sid] = 1; list.push(map[sid]); } });
      Object.keys(map).forEach(sid => { if (!seen[sid]) list.push(map[sid]); });
      const parsed = [];
      list.forEach(j => { try { parsed.push(JSON.parse(j)); } catch (e) { } });
      written[key] = { items: map, idx: idx[name] || '' };
      if (parsed.length) out[key] = JSON.stringify(parsed);
    }));
    return out;
  }

  async function saveSimple(uid, key, value) {
    const ref = doc(db, 'users', uid, 'data', key);
    if (value === null) await deleteDoc(ref);
    else await setDoc(ref, { v: value, t: serverTimestamp() });
  }

  async function saveCollection(uid, key, name, value) {
    let arr = [];
    try { arr = value ? JSON.parse(value) : []; } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    arr = arr.filter(i => i && i.id != null);
    const w = written[key] || (written[key] = { items: {}, idx: '' });
    const ops = [], next = {};
    arr.forEach(item => {
      const id = String(item.id), j = JSON.stringify(item);
      next[id] = j;
      if (w.items[id] !== j) ops.push({ set: true, ref: doc(db, 'users', uid, name, id), data: { j }, size: j.length });
    });
    Object.keys(w.items).forEach(id => { if (!(id in next)) ops.push({ set: false, ref: doc(db, 'users', uid, name, id), size: 1 }); });
    const idxStr = JSON.stringify(arr.map(i => i.id));
    if (idxStr !== w.idx) ops.push({ set: true, ref: doc(db, 'users', uid, 'data', 'idx_' + name), data: { ids: idxStr }, size: idxStr.length });

    let batch = writeBatch(db), n = 0, size = 0;
    for (const op of ops) {
      if (n >= 200 || size + op.size > 4000000) { await batch.commit(); batch = writeBatch(db); n = 0; size = 0; }
      if (op.set) batch.set(op.ref, op.data); else batch.delete(op.ref);
      n++; size += op.size;
    }
    if (n) await batch.commit();
    w.items = next; w.idx = idxStr;
  }

  fxStore.backend = {
    save(uid, key, value) {
      const name = fxStore.COLLECTIONS[key];
      const job = () => name ? saveCollection(uid, key, name, value) : saveSimple(uid, key, value);
      chains[key] = (chains[key] || Promise.resolve()).then(job, job);
      return chains[key];
    }
  };

  /* ---------- one-time import of data from the old localStorage version ---------- */
  async function importLegacy(cloudWasEmpty) {
    const l = legacyLS();
    if (!l || !cloudWasEmpty) return;
    const found = LEGACY_DATA.filter(k => l.getItem(k) !== null);
    if (!found.length) return;
    found.forEach(k => fxStore.setItem(k, l.getItem(k)));
    const ok = await fxStore.flush();
    if (ok) {
      found.forEach(k => l.removeItem(k));
      (window.fbNotices = window.fbNotices || []).push({ m: 'Your existing journal from this device was moved to your cloud account.', t: 'success' });
    }
  }

  /* ---------- auth state ---------- */
  let first = true, suppress = false;
  async function handle(user) {
    if (user) {
      window.fbUser = {
        uid: user.uid,
        name: user.displayName || (user.email || 'Trader').split('@')[0],
        email: user.email || '',
        photo: user.photoURL || null
      };
      window.fbLoadError = null;
      try {
        const out = await loadAll(user.uid);
        fxStore.hydrate(user.uid, out);
        await importLegacy(Object.keys(out).length === 0);
      } catch (e) {
        console.error('Could not load cloud data', e);
        fxStore.reset();
        window.fbLoadError = e;
      }
    } else {
      window.fbUser = null;
      window.fbLoadError = null;
      fxStore.reset();
    }
    if (first) { first = false; window.__fbResolve(); }
    else if (window.__onAuthChange) window.__onAuthChange(window.fbUser);
  }

  try { await getRedirectResult(auth); } catch (e) { window.fbRedirectError = e; }
  onAuthStateChanged(auth, u => { if (!suppress) handle(u); });

  /* ---------- public API used by the page ---------- */
  window.fbApi = {
    signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
    async signUp(name, email, pw) {
      suppress = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        try { await updateProfile(cred.user, { displayName: name }); } catch (e) { console.warn(e); }
      } finally { suppress = false; }
      await handle(auth.currentUser);
    },
    async google() {
      try { await signInWithPopup(auth, googleProvider); }
      catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
          await signInWithRedirect(auth, googleProvider);
          return;
        }
        throw e;
      }
    },
    resetPassword: email => sendPasswordResetEmail(auth, email),
    async signOut() {
      try { await fxStore.flush(); } catch (e) { }
      await signOut(auth);
    },
    async updateName(name) {
      if (!auth.currentUser) throw new Error('You are not signed in.');
      await updateProfile(auth.currentUser, { displayName: name });
      window.fbUser.name = name;
    },
    async changePassword(current, next) {
      const u = auth.currentUser;
      if (!u) throw new Error('You are not signed in.');
      if (!u.providerData.some(p => p.providerId === 'password')) {
        throw new Error('This account signs in with Google, so it has no password to change here.');
      }
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, current));
      await updatePassword(u, next);
    }
  };
} catch (e) {
  console.error('Firebase init failed', e);
  if (window.__fbFail) window.__fbFail(e);
}
</script>

            color: var(--text-primary);
        }

        body {
            -webkit-text-size-adjust: 100%;
            overflow-y: auto !important;
            overflow-x: hidden;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-secondary);
        }

        /* Premium Loader */
        .premium-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loader-content-3d {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }

        .loader-logo {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
        }

        .loader-icon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 30px rgba(37, 99, 235, 0.2);
        }

        .loader-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid var(--border-light);
            border-top-color: var(--primary-500);
            border-radius: 35px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-content-3d h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .loader-subtitle {
            color: var(--text-tertiary);
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .loader-progress-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .loader-progress-bar {
            flex: 1;
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
        }

        .loader-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-500), var(--primary-700));
            border-radius: 3px;
            transition: width 0.3s;
        }

        .loader-percentage {
            font-weight: 700;
            color: var(--primary-600);
            font-size: 0.875rem;
        }

        .loader-tips {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
        }

        .loader-tips i {
            color: var(--warning-500);
        }

        .loader-tips span {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-style: italic;
        }

        /* Dashboard Nav */
        .dashboard-nav {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--bg-primary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-left-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .menu-toggle {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .menu-toggle:hover {
            background: var(--border-light);
            border-color: var(--primary-500);
            color: var(--primary-600);
        }

        .dashboard-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon-small {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }

        .logo-text-small h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .logo-text-small span {
            font-size: 0.625rem;
            color: var(--text-tertiary);
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-right-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: var(--radius-full);
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .balance-pill i {
            font-size: 1rem;
        }

        .balance-label {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .balance-amount {
            font-weight: 800;
            font-size: 1rem;
        }

        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-light);
        }

        .user-profile-mini:hover {
            background: var(--border-light);
        }

        .user-avatar-small {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-100), var(--primary-200));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-700);
            font-weight: 600;
        }

        .user-info-dropdown {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-right: 0.5rem;
        }

        .user-name-small {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .user-info-dropdown i {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        /* Sidebar */
        .dashboard-sidebar {
            position: fixed;
            left: 0;
            top: 70px;
            width: 280px;
            height: calc(100vh - 70px);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 99;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
        }

        .dashboard-sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .sidebar-logo i {
            color: var(--primary-600);
        }

        .sidebar-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-tertiary);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .sidebar-close:hover {
            background: var(--danger-50);
            border-color: var(--danger-500);
            color: var(--danger-600);
        }

        .sidebar-user {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .sidebar-user-info h4 {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .sidebar-user-info p {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 0;
        }

        .menu-section {
            margin-bottom: 2rem;
        }

        .menu-section-title {
            padding: 0 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            font-weight: 700;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 0.25rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: var(--transition);
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-tertiary);
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--primary-700);
            border-left-color: var(--primary-500);
        }

        .nav-item:hover i {
            color: var(--primary-600);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.08), transparent);
            color: var(--primary-700);
            border-left-color: var(--primary-600);
            font-weight: 700;
        }

        .nav-item.active i {
            color: var(--primary-600);
        }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-light);
        }

        .sidebar-logout {
            width: 100%;
            padding: 0.875rem;
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-logout:hover {
            background: rgba(239, 68, 68, 0.08);
            border-color: var(--danger-500);
            color: var(--danger-600);
        }

        /* Dashboard Main */
        .dashboard-main {
            margin-top: 10px;
            margin-left: 0;
            padding: 2rem;
            transition: margin-left 0.3s;
            min-height: calc(100vh - 10px);
            background: var(--bg-secondary);
            overflow-y: visible;
        }

        @media (min-width: 1024px) {
            .dashboard-sidebar {
                transform: translateX(0);
            }
            
            .dashboard-main {
                margin-left: 280px;
            }
            
            .menu-toggle {
                display: none;
            }
            
            .sidebar-close {
                display: none;
            }
        }

        .dashboard-page {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .dashboard-page.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mentorship Banner */
        .mentorship-premium-banner {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            color: white;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .banner-content i {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .banner-content h3 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: white;
        }

        .banner-content p {
            font-size: 0.75rem;
            opacity: 0.9;
            color: rgba(255, 255, 255, 0.9);
        }

        .banner-cta-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-full);
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.875rem;
        }

        .banner-cta-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            color: white;
        }

        /* Dashboard Header */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .dashboard-header h1 span {
            color: var(--primary-600);
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .action-btn-export {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.875rem;
            box-shadow: var(--shadow-sm);
        }

        .action-btn-export:hover {
            background: var(--primary-600);
            border-color: var(--primary-600);
            color: white;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        /* Stats Grid */
        .stats-grid-premium {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card-premium {
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            color: white;
        }

        .stat-card-premium:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl);
            filter: brightness(1.1);
        }

        .stat-card-premium.today-pnl { 
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
        }

        .stat-card-premium.weekly-pnl { 
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .stat-card-premium.monthly-pnl { 
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .stat-card-premium.total-growth { 
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: white;
        }

        .stat-content {
            flex: 1;
        }

        .stat-label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .stat-value-large {
            display: block;
            font-size: 1.75rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .stat-sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        /* Quick Trade Premium */
        .quick-trade-premium {
            position: relative;
            background: url('https://images.unsplash.com/photo-1639322537504-6427a16b0a28?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .quick-trade-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at top right, rgba(0,100,200,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
            transition: transform 10s ease;
        }

        .quick-trade-premium:hover::before {
            transform: scale(1.1);
        }

        .section-header-premium {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title i,
        .header-title h3 {
            color: white;
        }

        .header-title i {
            font-size: 1.25rem;
        }

        .header-title h3 {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .trade-limit-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
        }

        .trade-limit-indicator span {
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .limit-progress {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .limit-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .trade-form-premium {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-row-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .form-group-premium {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group-premium label {
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .form-group-premium label i {
            color: var(--primary-400);
        }

        .premium-input,
        .premium-select,
        .premium-textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            color: #333;
            font-size: 0.875rem;
            transition: var(--transition);
            font-family: var(--font-sans);
            backdrop-filter: blur(5px);
        }

        .premium-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .premium-input:focus,
        .premium-select:focus,
        .premium-textarea:focus {
            outline: none;
            border-color: var(--primary-500);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .premium-input.with-prefix {
            padding-left: 2rem;
        }

        .premium-input:read-only {
            background: var(--bg-tertiary);
            color: var(--text-tertiary);
            border-color: var(--border-light);
            cursor: not-allowed;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 1rem;
            color: #666;
            font-weight: 600;
            font-size: 0.875rem;
            z-index: 1;
        }

        .strategy-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        .strategy-wrapper .premium-select {
            flex: 1;
        }

        .btn-add-strategy {
            width: 42px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            color: white;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add-strategy:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .form-actions-premium {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn-save-trade,
        .btn-save-download,
        .btn-clear,

        /* ===== ANALYTICS PAGE - OPTIMIZED FOR MOBILE ===== */
.dashboard-page#analytics {
    background: var(--bg-secondary);
    min-height: 100vh;
    padding: 1rem !important;
    width: 100%;
}

/* Analytics Cards - Full Width on Mobile */
.analytics-card {
    background: var(--bg-primary);
    border-radius: 20px;
    padding: 1.25rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border-light);
    margin-bottom: 1.25rem;
    width: 100%;
}

.card-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--border-light);
}

.card-header h3 {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--text-primary);
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
}

.card-header i {
    color: var(--primary-500);
    background: rgba(59, 130, 246, 0.1);
    padding: 0.4rem;
    border-radius: 10px;
    font-size: 1rem;
}

/* Chart Controls */
.chart-controls {
    display: flex;
    gap: 0.4rem;
}

.period-btn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-light);
    color: var(--text-secondary);
    padding: 0.4rem 1rem;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 50px;
}

.period-btn.active {
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
}

/* Win/Loss Container - Stack on Mobile */
.win-loss-container {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    width: 100%;
}

.win-loss-left,
.win-loss-right {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
}

.ratio-header {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
    margin-bottom: 0.5rem;
}

/* Chart Wrappers - Full Width on Mobile */
.chart-wrapper {
    position: relative;
    width: 100%;
    max-width: 350px;
    aspect-ratio: 1/1;
    margin: 0 auto;
}

.chart-wrapper.half-donut {
    max-width: 320px;
}

/* Stats Row - Responsive Grid */
.stats-row {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 1.5rem;
    width: 100%;
    background: var(--bg-tertiary);
    padding: 1rem;
    border-radius: 16px;
    border: 1px solid var(--border-light);
    flex-wrap: wrap;
}

.stat-box {
    text-align: center;
    min-width: 120px;
    flex: 1;
}

.stat-box .stat-label {
    display: block;
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.stat-box .stat-value {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-primary);
}

.stat-box.profit .stat-value {
    color: #10b981;
}

.stat-box.loss .stat-value {
    color: #ef4444;
}

.stat-box .stat-sub-value {
    font-size: 0.8rem;
    color: var(--text-tertiary);
    margin-top: 0.1rem;
}

/* Equity Chart - Full Width Container */
.equity-chart-container {
    position: relative;
    width: 100%;
    height: 300px;
    margin: 1rem 0;
    cursor: crosshair;
}

/* Chart Tooltip */
.chart-tooltip {
    position: absolute;
    display: none;
    background: var(--bg-primary);
    padding: 0rem 0rem;
    border-radius: 5px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    border: 1px solid var(--border-light);
    z-index: 1000;
    pointer-events: none;
    transform: translate(-50%, -120%);
}

.tooltip-date {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    margin-bottom: 0.1rem;
    font-weight: 500;
}

.tooltip-value {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-primary);
}

/* Equity Stats - Grid Layout */
.equity-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-top: 1rem;
    padding-top: 0rem;
    border-top: 2px solid var(--border-light);
}

.equity-stat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    color: var(--text-tertiary);
    font-size: 0.8rem;
    background: var(--bg-tertiary);
    padding: 0rem;
    border-radius: 50px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
}

.equity-stat i {
    font-size: 0.8rem;
}

.equity-stat strong {
    color: var(--text-primary);
    font-weight: 700;
    margin-left: 0rem;
}

/* Calendar Section */
.calendar-wrapper {
    width: 100%;
    overflow-x: auto;
}

.calendar-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
    background: var(--bg-tertiary);
    padding: 0.5rem 1rem;
    border-radius: 50px;
    border: 1px solid var(--border-light);
}

.calendar-nav {
    background: var(--bg-primary);
    border: 1px solid var(--border-light);
    color: var(--primary-500);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.calendar-nav:hover {
    background: var(--primary-500);
    color: white;
    border-color: var(--primary-500);
}

.calendar-month {
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 600;
}

/* Calendar Grid - Full Width */
.calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
}

.calendar-weekday {
    text-align: center;
    font-weight: 600;
    color: var(--primary-500);
    padding: 0.6rem 0.2rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    background: var(--bg-tertiary);
    border-radius: 8px;
    border: 1px solid var(--border-light);
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 1rem;
}

.calendar-day {
    aspect-ratio: 1/0.9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-primary);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid var(--border-light);
    color: var(--text-primary);
    font-weight: 500;
    font-size: 0.8rem;
    position: relative;
    padding: 2px;
}

.calendar-day.profit-day {
    background: rgba(16, 185, 129, 0.15);
    border-color: #10b981;
    color: #10b981;
    font-weight: 600;
}

.calendar-day.loss-day {
    background: rgba(239, 68, 68, 0.15);
    border-color: #ef4444;
    color: #ef4444;
    font-weight: 600;
}

.calendar-day.current-day {
    background: rgba(59, 130, 246, 0.15);
    border: 2px solid var(--primary-500);
    color: var(--primary-500);
    font-weight: 700;
}

.calendar-day .day-pnl {
    font-size: 0.55rem;
    font-weight: 600;
    margin-top: 2px;
}

/* Calendar Legend */
.calendar-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 2px solid var(--border-light);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-tertiary);
    font-size: 0.75rem;
    background: var(--bg-tertiary);
    padding: 0.3rem 1rem;
    border-radius: 50px;
    border: 1px solid var(--border-light);
}

.legend-color {
    width: 14px;
    height: 14px;
    border-radius: 4px;
}

.legend-color.profit {
    background: rgba(16, 185, 129, 0.3);
    border: 1px solid #10b981;
}

.legend-color.loss {
    background: rgba(239, 68, 68, 0.3);
    border: 1px solid #ef4444;
}

.legend-color.current {
    background: rgba(59, 130, 246, 0.3);
    border: 2px solid var(--primary-500);
}

.cl-open:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.cl-empty{text-align:center;padding:2.2rem 1rem;color:var(--text-tertiary);border:1px dashed var(--border-medium);border-radius:18px}
.cl-empty i{font-size:2rem;margin-bottom:.5rem;display:block}
.cl-bar{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.cl-bar h2{flex:1;font-size:1.3rem;font-weight:800;color:var(--text-primary);overflow-wrap:anywhere}
.cl-back,.cl-icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--border-light);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.cl-back:hover,.cl-icon:hover{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.cl-prog-head{display:flex;justify-content:space-between;color:var(--text-primary);margin-bottom:.6rem}
.cl-prog{height:8px;border-radius:99px;background:var(--border-light);overflow:hidden;margin-bottom:.4rem}
.cl-prog>div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#22c55e);border-radius:99px;transition:width .3s}
.cl-item{width:100%;display:flex;align-items:center;gap:1rem;padding:1.05rem .2rem;background:none;border:0;border-bottom:1px solid var(--border-light);cursor:pointer;text-align:left;color:var(--text-primary);font-size:1rem}
.cl-item:last-child{border-bottom:0}
.cl-box{width:30px;height:30px;border:2px solid var(--border-medium);border-radius:9px;display:flex;align-items:center;justify-content:center;color:transparent;flex:none;transition:all .15s;font-size:.8rem}
.cl-item[aria-checked="true"] .cl-box{background:#16a34a;border-color:#16a34a;color:#fff}
.cl-item[aria-checked="true"] .cl-text{color:var(--text-tertiary);text-decoration:line-through}
.cl-label{display:block;font-weight:800;margin:.2rem 0 .5rem;color:var(--text-primary)}
.cl-card .premium-textarea{min-height:130px}
.cl-card .cl-label+.premium-input,.cl-card .cl-label+.premium-textarea{margin-bottom:.9rem}
.cl-primary{width:100%;padding:1rem;border:0;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#1e40af);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 10px 22px rgba(29,78,216,.28);margin-bottom:12px}
.cl-secondary{width:100%;padding:1rem;border-radius:16px;border:1px solid var(--border-light);background:var(--bg-primary);color:var(--text-primary);font-weight:800;font-size:1rem;cursor:pointer}
.cl-primary:hover,.cl-secondary:hover{filter:brightness(1.06)}
.cl-hcard{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;text-align:left;background:var(--bg-primary);border:1px solid var(--border-light);border-radius:18px;padding:1rem 1.1rem;cursor:pointer;color:var(--text-primary);transition:transform .18s,box-shadow .18s}
.cl-hcard:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,23,42,.1)}
.cl-htitle{font-weight:800;font-size:1rem;overflow-wrap:anywhere}
.cl-hdate{font-size:.85rem;color:var(--text-tertiary);margin-top:2px}
.cl-hmeta{font-size:.85rem;color:var(--text-tertiary);margin-top:2px}
.cl-score{font-weight:800;font-size:1.1rem;white-space:nowrap}
.cl-score span{color:var(--text-tertiary);margin-left:.5rem}

.cl-det-date{color:var(--text-tertiary);font-size:.85rem;margin-bottom:.8rem}
.cl-det-item{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--border-light);color:var(--text-primary)}
.cl-det-item:last-child{border-bottom:0}

.cl-shot{width:100%;max-height:420px;object-fit:contain;border-radius:14px;border:1px solid var(--border-light);background:#0b1226;cursor:zoom-in;margin-bottom:.9rem}
.cl-danger{width:100%;margin-top:6px;padding:.9rem;border-radius:14px;border:1px solid #ef4444;background:rgba(239,68,68,.08);color:#ef4444;font-weight:800;cursor:pointer}
.cl-danger:hover{background:#ef4444;color:#fff}
.cl-ed-row{display:flex;gap:8px;margin-bottom:8px}

// ===== CORRECT BALANCE CALCULATION =====
function calculateAccountBalance() {
    // Current Balance = Starting Balance + Total P&L - Total Withdrawals
    const totalPnL = trades.reduce((sum, t) => sum + (parseFloat(t.pnl) || 0), 0);
    const totalWithdrawals = withdrawals.reduce((sum, w) => sum + (parseFloat(w.amount) || 0), 0);
    const calculatedBalance = startingBalance + totalPnL - totalWithdrawals;
    return calculatedBalance;
}

    accountBalance = calculateAccountBalance();

// ===== UTILITY FUNCTIONS =====
function formatCurrency(amount) {
    if (amount === null || amount === undefined || isNaN(amount)) return '$0.00';
    return `$${Math.abs(amount).toFixed(2)}`;
}

function formatCurrencyWithSign(amount) {
    if (amount === null || amount === undefined || isNaN(amount)) return '$0.00';
    const sign = amount >= 0 ? '+' : '-';
    return `${sign}$${Math.abs(amount).toFixed(2)}`;
}

function formatDate(dateString) {
    if (!dateString) return '';
    try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
        });
    } catch {
        return dateString;
    }
}

function formatFullDate(dateString) {
    if (!dateString) return '';
    try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        });
    } catch {
        return dateString;
    }
}

function formatDateTime(dateString, timeString) {
    if (!dateString) return '';
    try {
        return `${formatFullDate(dateString)} ${timeString || ''}`.trim();
    } catch {
        return dateString;
    }
}

function showToast(message, type = 'info') {
    let container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const iconMap = {
        'success': 'check-circle',
        'error': 'exclamation-circle',
        'warning': 'exclamation-triangle',
        'info': 'info-circle'
    };
    
    const icon = iconMap[type] || 'info-circle';
    
    toast.innerHTML = `
        <i class="fas fa-${icon}"></i>
        <span>${message}</span>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => {
            if (toast.parentNode === container) {
                container.removeChild(toast);
            }
        }, 300);
    }, 3000);
}

function updateDashboardStats() {
    const today = new Date().toISOString().split('T')[0];
    const todayTrades = trades.filter(t => t.date === today);
    const todayPnL = todayTrades.reduce((sum, t) => sum + (parseFloat(t.pnl) || 0), 0);
    
    const todayPnlEl = document.getElementById('todayPnl');
    if (todayPnlEl) todayPnlEl.textContent = formatCurrencyWithSign(todayPnL);
    
    const todayTradesCountEl = document.getElementById('todayTradesCount');
    if (todayTradesCountEl) todayTradesCountEl.textContent = `${todayTrades.length}/${getDailyLimit()} trades`;
    
    const todayTradeCountEl = document.getElementById('todayTradeCount');
    if (todayTradeCountEl) todayTradeCountEl.textContent = `${todayTrades.length}/${getDailyLimit()}`;
    
    const dailyLimitProgressEl = document.getElementById('dailyLimitProgress');
    if (dailyLimitProgressEl) {
        const dailyProgress = Math.min(100, (todayTrades.length / getDailyLimit()) * 100);
        dailyLimitProgressEl.style.width = `${dailyProgress}%`;
    }
    
    const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
    const weeklyTrades = trades.filter(t => t.date >= weekAgo);
    const weeklyPnL = weeklyTrades.reduce((sum, t) => sum + (parseFloat(t.pnl) || 0), 0);
    
    const weeklyPnlEl = document.getElementById('weeklyPnl');

    const monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

// ===== TRADE FUNCTIONS =====
function saveTrade() {
    console.log('📊 Saving trade...');
    
    const date = document.getElementById('tradeDate')?.value;
    const time = document.getElementById('tradeTime')?.value;
    const tradeNumber = parseInt(document.getElementById('tradeNumber')?.value) || 1;
    const pair = document.getElementById('currencyPair')?.value;
    const direction = document.getElementById('tradeDirection')?.value;
    let strategy = document.getElementById('strategy')?.value;
    const customStrategy = document.getElementById('customStrategy')?.value;
    const pnl = parseFloat(document.getElementById('pnlAmount')?.value);
    const notes = document.getElementById('tradeNotes')?.value;
    
    if (!date || !time || !pair || !direction || isNaN(pnl)) {
        showToast('Please fill all required fields', 'error');
        return false;
    }
    
    // Check daily limit
    const todayTrades = trades.filter(t => t.date === date);
    const dailyLimit = getDailyLimit();
    if (todayTrades.length >= dailyLimit) {
        showToast(`Daily limit of ${dailyLimit} trades reached. Stop trading for today!`, 'error');
        return false;
    }

    // Optional screenshot + TradingView link
    const media = fxTradeMedia();
    if (media.error) {
        showToast(media.error, 'error');
        return false;
    }
    
    // Use custom strategy if selected
    if (customStrategy && document.getElementById('customStrategy').style.display !== 'none') {
        strategy = customStrategy;
    }
    
    // Create trade object
    const trade = {
        id: Date.now(),
        date,
        time,
        tradeNumber,
        pair,
        direction,
        strategy: strategy || 'Manual',
        pnl,
        notes: notes || 'No notes',
        screenshot: media.screenshot,
        link: media.link,
        type: 'trade'
    };
    
    trades.unshift(trade);
    saveTrades();
    
    // Update balance
    accountBalance = calculateAccountBalance();
    
    // Update ALL displays
    updateAccountBalanceDisplay();
    updateDashboardStats();
    updateRecentActivity();
    updateAllTradesTable();
    updateCalendar();
    
    // Update charts
    if (equityChart) {
        updateEquityChart(document.querySelector('.period-btn.active')?.getAttribute('data-period') || '1m');
    }
    if (winLossChart) {
        updateWinLossChart();
    }
    if (buysSellsChart) {
        updateBuysSellsChart();
    }
    
    // Clear form
    document.getElementById('pnlAmount').value = '';
    document.getElementById('tradeNotes').value = '';
    document.getElementById('customStrategy').style.display = 'none';
    document.getElementById('customStrategy').value = '';
    fxAfterTradeSaved();

    showToast(`Trade saved! P&L: ${formatCurrencyWithSign(pnl)}`, 'success');
    console.log(`✅ Trade saved - New balance: $${accountBalance}`);
    verifyDataPersistence();
    return true;
}

function deleteTrade(tradeId) {
    if (!confirm('Delete this trade?')) return;
    
    trades = trades.filter(t => t.id !== tradeId);
    saveTrades();
    
    accountBalance = calculateAccountBalance();
    
    updateAccountBalanceDisplay();
    updateDashboardStats();
    updateRecentActivity();
    updateAllTradesTable();
    updateCalendar();
    
    if (equityChart) {
        updateEquityChart(document.querySelector('.period-btn.active')?.getAttribute('data-period') || '1m');
    }
    if (winLossChart) {
        updateWinLossChart();
    }
    if (buysSellsChart) {
        updateBuysSellsChart();
    }
    
    showToast('Trade deleted', 'success');
}

// ===== DEPOSIT FUNCTIONS =====
function processDeposit() {
    console.log('💰 Processing deposit...');
    
    const date = document.getElementById('depositDate')?.value;
    const time = document.getElementById('depositTime')?.value;
    const broker = document.getElementById('depositBroker')?.value;
    const amount = parseFloat(document.getElementById('depositAmount')?.value);
    const notes = document.getElementById('depositNotes')?.value;
    
    if (!date || !time || !broker || isNaN(amount) || amount <= 0) {
        showToast('Please fill all fields with valid amount', 'error');
        return false;
    }
    
    // Store previous balance
    const oldBalance = startingBalance;
    
    // Starting balance becomes the deposit amount
    startingBalance = amount;
    saveStartingBalance();
    
    // Create deposit record
    const deposit = {
        id: Date.now(),
        date,
        time,
        broker,
        amount: amount,
        notes: notes || 'Deposit',
        balanceBefore: oldBalance,
        balanceAfter: amount,
        type: 'deposit'
    };
    
    // Replace deposits (single deposit system)
    deposits = [deposit];
    saveDeposits();
    
    // Reset trades and withdrawals for new account
    trades = [];
    withdrawals = [];
    saveTrades();
    saveWithdrawals();
    
    // Update balance
    accountBalance = calculateAccountBalance();
    
    // Update ALL displays
    updateAccountBalanceDisplay();
    updateRecentActivity();
    updateTransactionHistory();
    updateAllTradesTable();
    updateDashboardStats();
    updateCalendar();
    
    // Update charts
    if (equityChart) {
        updateEquityChart('1m');
    }
    if (winLossChart) {
        updateWinLossChart();
    }
    if (buysSellsChart) {
        updateBuysSellsChart();
    }
    
    // Clear form
    document.getElementById('depositAmount').value = '';
    document.getElementById('depositNotes').value = '';

// ===== WITHDRAWAL FUNCTIONS =====
function processWithdrawal() {
    console.log('💸 Processing withdrawal...');
    
    const date = document.getElementById('withdrawalDate')?.value;
    const time = document.getElementById('withdrawalTime')?.value;
    const broker = document.getElementById('withdrawalBroker')?.value;
    const amount = parseFloat(document.getElementById('withdrawalAmount')?.value);
    const notes = document.getElementById('withdrawalNotes')?.value;
    
    if (!date || !time || !broker || isNaN(amount) || amount <= 0) {
        showToast('Please fill all fields with valid amount', 'error');
        return false;
    }
    
    // Calculate current balance
    const currentBalance = calculateAccountBalance();
    
    if (amount > currentBalance) {
        showToast(`Insufficient balance! Available: ${formatCurrency(currentBalance)}`, 'error');
        return false;
    }
    
    // Create withdrawal
    const withdrawal = {
        id: Date.now(),
        date,
        time,
        broker,
        amount: amount,
        notes: notes || 'Withdrawal',
        balanceBefore: currentBalance,
        balanceAfter: currentBalance - amount,
        type: 'withdrawal'
    };
    
    withdrawals.unshift(withdrawal);
    saveWithdrawals();
    
    // Update balance
    accountBalance = calculateAccountBalance();
    
    // Update ALL displays
    updateAccountBalanceDisplay();
    updateRecentActivity();
    updateTransactionHistory();
    updateDashboardStats();
    
    // Update charts
    if (equityChart) {
        updateEquityChart(document.querySelector('.period-btn.active')?.getAttribute('data-period') || '1m');
    }
    
    // Clear form
    document.getElementById('withdrawalAmount').value = '';
    document.getElementById('withdrawalNotes').value = '';
    document.getElementById('newBalanceAfterWithdrawal').value = (currentBalance - amount).toFixed(2);
    
    showToast(`Withdrawal of $${amount.toFixed(2)} processed!`, 'success');
    console.log(`✅ Withdrawal complete - New balance: $${accountBalance}`);
    verifyDataPersistence();
    return true;
}

function saveAndDownloadWithdrawal() {
    if (processWithdrawal() && withdrawals.length > 0) {
        setTimeout(() => downloadWithdrawalPDF(withdrawals[0]), 500);
    }
}

function deleteWithdrawal(withdrawalId) {
    if (!confirm('Delete this withdrawal?')) return;
    
    withdrawals = withdrawals.filter(w => w.id !== withdrawalId);
    saveWithdrawals();
    
    accountBalance = calculateAccountBalance();
    
    updateAccountBalanceDisplay();
    updateRecentActivity();
    updateTransactionHistory();
    updateDashboardStats();
    
    if (equityChart) {
        updateEquityChart(document.querySelector('.period-btn.active')?.getAttribute('data-period') || '1m');
    }
    
    showToast('Withdrawal deleted', 'success');
}

    if (totalTradesEl) totalTradesEl.textContent = trades.length;
    
    const winningTradesEl = document.getElementById('winningTradesCount');
    if (winningTradesEl) winningTradesEl.textContent = winningTrades;
    
    const losingTradesEl = document.getElementById('losingTradesCount');
    if (losingTradesEl) losingTradesEl.textContent = losingTrades;

// ===== EQUITY DATA GENERATION =====
function getEquityData(period) {
    // Start with starting balance
    const startBal = startingBalance || 0;
    
    // Collect all balance-changing events (excluding deposits - they're the start)
    const events = [];
    
    // Add trades
    trades.forEach(t => {
        if (t.date && t.pnl) {
            events.push({
                date: t.date,
                amount: parseFloat(t.pnl) || 0,
                type: 'trade'
            });
        }
    });
    
    // Add withdrawals
    withdrawals.forEach(w => {
        if (w.date && w.amount) {
            events.push({
                date: w.date,
                amount: -(parseFloat(w.amount) || 0),
                type: 'withdrawal'
            });
        }
    });
    
    // Sort by date
    events.sort((a, b) => new Date(a.date) - new Date(b.date));
    
    // Group by date
    const dailyChanges = new Map();
    events.forEach(event => {
        const date = event.date;
        if (!dailyChanges.has(date)) {
            dailyChanges.set(date, 0);
        }
        dailyChanges.set(date, dailyChanges.get(date) + event.amount);
    });
    
    // Get unique dates with activity
    const activeDates = Array.from(dailyChanges.keys()).sort();
    
    if (period === '1m') {
        // Last 30 days
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
        
        const relevantDates = activeDates.filter(date => new Date(date) >= oneMonthAgo);
        
        const labels = ['Start'];
        const data = [startBal];
        let runningBalance = startBal;
        
        relevantDates.forEach(date => {
            runningBalance += dailyChanges.get(date);
            data.push(runningBalance);
            labels.push(formatDate(date));
        });
        
        updateEquityStats(data);
        
        return {
            labels,
            datasets: [{
                label: 'Account Balance',
                data,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true
            }]
        };
    } else {
        // 12M view - group by month
        const monthlyData = new Map();
        
        events.forEach(event => {
            const monthKey = event.date.substring(0, 7);
            if (!monthlyData.has(monthKey)) {
                monthlyData.set(monthKey, 0);
            }
            monthlyData.set(monthKey, monthlyData.get(monthKey) + event.amount);
        });
        
        const labels = ['Start'];
        const data = [startBal];
        let runningBalance = startBal;
        
        const sortedMonths = Array.from(monthlyData.keys()).sort().slice(-12);
        
        sortedMonths.forEach(month => {
            runningBalance += monthlyData.get(month);
            data.push(runningBalance);
            const [year, monthNum] = month.split('-');
            const monthName = new Date(year, monthNum - 1, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
            labels.push(monthName);
        });
        
        updateEquityStats(data);
        
        return {
            labels,
            datasets: [{
                label: 'Account Balance',
                data,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true
            }]
        };
    }
}

function updateEquityStats(data) {
    const peak = Math.max(...data);
    const currentEquity = data[data.length - 1];
    const drawdown = peak > 0 ? ((peak - currentEquity) / peak * 100).toFixed(1) : 0;
    
    const peakEl = document.getElementById('equityPeak');
    if (peakEl) peakEl.textContent = formatCurrency(peak);
    
    const drawdownEl = document.getElementById('equityDrawdown');
    if (drawdownEl) drawdownEl.textContent = `${drawdown}%`;
}

function updateCalendar() {
    const grid = document.getElementById('calendarGrid');
    const monthYear = document.getElementById('calendarMonthYear');
    if (!grid || !monthYear) return;
    
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
    
    monthYear.textContent = `${monthNames[currentCalendarMonth]} ${currentCalendarYear}`;
    
    const firstDay = new Date(currentCalendarYear, currentCalendarMonth, 1);
    const lastDay = new Date(currentCalendarYear, currentCalendarMonth + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startingDay = firstDay.getDay();
    
    let html = '';
    
    // Empty cells for days before month starts
    for (let i = 0; i < startingDay; i++) {
        html += '<div class="calendar-day empty"></div>';
    }
    
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${currentCalendarYear}-${String(currentCalendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const today = new Date().toISOString().split('T')[0];
        
        const dayTrades = trades.filter(t => t.date === dateStr);
        const dayPnL = dayTrades.reduce((sum, t) => sum + (parseFloat(t.pnl) || 0), 0);
        
        let dayClass = 'calendar-day';
        if (dateStr === today) dayClass += ' current-day';
        if (dayTrades.length > 0) {
            dayClass += dayPnL >= 0 ? ' profit-day' : ' loss-day';
        }
        
        html += `
            <div class="${dayClass}">
                <span class="calendar-date">${day}</span>
                ${dayTrades.length > 0 ? `
                    <span class="day-pnl ${dayPnL >= 0 ? 'profit' : 'loss'}">
                        ${dayPnL >= 0 ? '+' : '-'}$${Math.abs(dayPnL).toFixed(0)}
                    </span>
                ` : ''}
            </div>
        `;
    }
    
    grid.innerHTML = html;
}

function changeCalendarMonth(direction) {
    currentCalendarMonth += direction;
    
    if (currentCalendarMonth < 0) {
        currentCalendarMonth = 11;
        currentCalendarYear--;
    } else if (currentCalendarMonth > 11) {
        currentCalendarMonth = 0;
        currentCalendarYear++;
    }
    
    updateCalendar();
}

function generateStyledPDF({ title, content, filename, color = '#3b82f6' }) {
    try {
        const { jsPDF } = window.jspdf;
        if (!jsPDF) {
            showToast('PDF library not loaded', 'error');
            return;
        }
        
        const pdf = new jsPDF();
        const pageWidth = pdf.internal.pageSize.width;
        const margin = 20;
        const user = getCurrentUser();
        
        // Header
        pdf.setFillColor(color);
        pdf.rect(0, 0, pageWidth, 30, 'F');
        
        pdf.setTextColor(255, 255, 255);
        pdf.setFontSize(20);
        pdf.setFont('helvetica', 'bold');
        pdf.text(title, margin, 20);
        
        // Info
        pdf.setTextColor(100, 100, 100);
        pdf.setFontSize(10);
        pdf.setFont('helvetica', 'normal');
        pdf.text(`Generated: ${new Date().toLocaleString()}`, margin, 40);
        pdf.text(`Trader: ${user.name || 'Trader'}`, margin, 48);
        
        // Line
        pdf.setDrawColor(color);
        pdf.setLineWidth(0.5);
        pdf.line(margin, 55, pageWidth - margin, 55);
        
        // Content
        const lines = content.split('\n');
        let yPos = 70;
        
        lines.forEach(line => {
            if (yPos > 280) {
                pdf.addPage();
                yPos = 20;
            }
            
            if (line.startsWith('TRADE DETAILS') || line.startsWith('ACCOUNT OVERVIEW') || 
                line.startsWith('PERFORMANCE METRICS') || line.startsWith('ALL TRADES') ||
                line.startsWith('DEPOSIT HISTORY') || line.startsWith('WITHDRAWAL HISTORY') ||
                line.startsWith('ACCOUNT SUMMARY')) {
                pdf.setTextColor(color);
                pdf.setFontSize(14);
                pdf.setFont('helvetica', 'bold');
                pdf.text(line, margin, yPos);
                yPos += 8;
            } else if (line.startsWith('=')) {
                pdf.setTextColor(150, 150, 150);
                pdf.setFontSize(10);
                pdf.text(line, margin, yPos);
                yPos += 5;
            } else if (line.includes('WIN') || line.includes('+') || line.includes('profit')) {
                pdf.setTextColor(34, 197, 94);
                pdf.setFontSize(10);
                pdf.text(line, margin, yPos);
                yPos += 5;
            } else if (line.includes('LOSS') || line.includes('-') || line.includes('loss')) {
                pdf.setTextColor(239, 68, 68);
                pdf.setFontSize(10);
                pdf.text(line, margin, yPos);
                yPos += 5;
            } else {
                pdf.setTextColor(50, 50, 50);
                pdf.setFontSize(10);
                pdf.text(line, margin, yPos);
                yPos += 5;
            }
        });
        
        // Footer
        pdf.setTextColor(150, 150, 150);
        pdf.setFontSize(8);
        pdf.text('FX TAE Charts Trading Journal', margin, pdf.internal.pageSize.height - 10);
        pdf.text(`Downloaded by: ${user.name || 'Trader'}`, margin, pdf.internal.pageSize.height - 5);
        
        pdf.save(filename);
        showToast(`PDF downloaded: ${filename}`, 'success');
    } catch (error) {
        console.error('PDF error:', error);
        showToast('Error generating PDF', 'error');
    }
}

    if (newPass !== confirm) {

    if (newPass.length < 6) {

    window.fbApi.changePassword(current, newPass).then(() => {
        showToast('Password changed successfully', 'success');

function calculatePositionSize() {
    const balance = parseFloat(document.getElementById('calcBalance')?.value);
    const riskPercent = parseFloat(document.getElementById('calcRiskPercent')?.value);
    const stopLoss = parseFloat(document.getElementById('calcStopLoss')?.value);
    
    if (isNaN(balance) || isNaN(riskPercent) || isNaN(stopLoss) || stopLoss <= 0) {
        showToast('Please enter valid values', 'error');
        return;
    }
    
    const riskAmount = balance * (riskPercent / 100);
    const positionSize = riskAmount / (stopLoss * 10);

function filterTransactions(filter) {
    const tableBody = document.getElementById('transactionHistoryTable');
    if (!tableBody) return;
    
    let filtered = [];
    if (filter === 'all') {
        filtered = [...deposits.map(d => ({ ...d, transactionType: 'deposit' })),
                   ...withdrawals.map(w => ({ ...w, transactionType: 'withdrawal' }))];
    } else if (filter === 'deposit') {
        filtered = deposits.map(d => ({ ...d, transactionType: 'deposit' }));
    } else if (filter === 'withdrawal') {
        filtered = withdrawals.map(w => ({ ...w, transactionType: 'withdrawal' }));
    }
    
    filtered.sort((a, b) => {
        const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
        const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
        return dateB - dateA;
    });
    
    if (filtered.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align: center; padding: 2rem;">
                    <i class="fas fa-money-bill-transfer" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
                    <p>No transactions found</p>
                </td>
            </tr>
        `;
        return;
    }
    
    tableBody.innerHTML = filtered.map(t => {
        if (t.transactionType === 'deposit') {
            return `
                <tr>
                    <td>${formatDateTime(t.date, t.time)}</td>
                    <td><span class="badge" style="background: rgba(34,197,94,0.1); color: #22c55e;">DEPOSIT</span></td>
                    <td>${t.broker}</td>
                    <td class="profit" style="font-weight: 600;">${formatCurrency(t.amount)}</td>
                    <td>${formatCurrency(t.balanceBefore)}</td>
                    <td>${formatCurrency(t.balanceAfter)}</td>
                    <td>${t.notes || '-'}</td>
                    <td>
                        ${fxActionBtns('deposit', t.id)}
                    </td>
                </tr>
            `;
        } else {
            return `
                <tr>
                    <td>${formatDateTime(t.date, t.time)}</td>
                    <td><span class="badge" style="background: rgba(239,68,68,0.1); color: #ef4444;">WITHDRAWAL</span></td>
                    <td>${t.broker}</td>
                    <td class="loss" style="font-weight: 600;">${formatCurrency(t.amount)}</td>
                    <td>${formatCurrency(t.balanceBefore)}</td>
                    <td>${formatCurrency(t.balanceAfter)}</td>
                    <td>${t.notes || '-'}</td>
                    <td>
                        ${fxActionBtns('withdrawal', t.id)}
                    </td>
                </tr>
            `;
        }
    }).join('');
}
